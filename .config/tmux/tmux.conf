set -g @plugin 'tmux-plugins/tpm' 
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_middle_separator " | "

set -g @catppuccin_window_default_fill "none"

set -g @catppuccin_window_current_fill "all"

# set -g @catppuccin_status_modules_right "date_time"
set -g @catppuccin_status_modules_right "null"
set -g @catppuccin_status_background "none"
# set -g @catppuccin_status_left_separator ""
# set -ogq @catppuccin_pane_background_color "#000000"
# set -ogq @catppuccin_window_number_color "#000000"
# set -ogq @catppuccin_status_module_bg_color "#000000"
#
# set -ogq @catppuccin_window_text_color "#0000000"
set -ogq @catppuccin_pane_color "#{@thm_green}"
# set -g @catppuccin_date_time_text "%H:%M "

set -g @catppuccin_status_right_separator "null"
set -g @catppuccin_status_middle_separator "null"
set -g @catppuccin_status_left_separator "null"
set -g @catppuccin_date_time_icon "null"
set -g @catppuccin_date_time_color "null"
set -g mouse on

# Bind new prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start Window numbers from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# bind '"' split-window -v -c "#{pane_current_path}"
# bind % split-window -h -c "#{pane_current_path}"

# Bindings for Window Manipulation
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind x kill-window
bind q kill-pane

# Bindings for Listing
set -g popup-border-lines rounded
# bind l display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
# bind l display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | fzf --reverse | xargs tmux switch-client -t"
# bind l display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | fzf --reverse --header='current: #{S}'"
bind l display-popup -E "current=\$(tmux display-message -p '#S'); \
  tmux list-sessions | sed -E 's/:.*$//' | \
  grep -v \"^\$current\$\" | \
  fzf --reverse --header=\"\$current\" | \
  xargs tmux switch-client -t"
bind o display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind space display-popup -w 90% -h 90% -E 'zsh' 


# Binding toggle status bar
bind t set status





run '~/.tmux/plugins/tpm/tpm' 
