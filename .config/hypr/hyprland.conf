# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,1920x1200@60,auto,1
# monitor=DP-3,2560x1440@144,auto,1
# monitor=DP-4,1920x1080@120,auto,1
monitor=,preferred,auto,1
# monitor=,preferred,auto,1, mirror, eDP-1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = hypridle
exec-once = hyprpaper
# exec-once = swaync
exec-once = dunst
# exec-once = eww open bar
exec-once = qs -d

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = ghostty
$fileManager = nautilus
# $menu = ulauncher
$menu = rofi -show drun
$lock = hyprlock

# Some default env vars.
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant = altgr-intl 
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 2

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0.1 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 2
    border_size = 2
    col.active_border = rgba(205,214,244,0.7)
    # col.active_border = rgba(c9c3c3aa)
    col.inactive_border = rgba(595959aa)
    #
    # col.active_border = rgba(#000000)
    # col.inactive_border = rgba(c9c3c3aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 1.0, 1.05

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile option removed in Hyprland 0.55 (it did nothing); use the `pseudo` dispatcher / mainMod + P
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true
}

gesture = 3, horizontal, workspace
gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = true
    workspace_swipe_create_new = true
    workspace_swipe_distance = 500
}
misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    disable_hyprland_logo = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#     sensitivity = -0.5
# }

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrulev2 = nofullscreenrequest, class:.* # You'll probably like this.
#windowrulev2 = suppressevent [maximize, fullscreen], class:.*
# windowrulev2 = monitor 0, move 100%-w-10 10, class:^(osgViewer)
#windowrulev2 = move 5 100%-w-5, class:^(osgViewer)


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# $mainMod = SUPER
$mainMod = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, S, pin, 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, Tab, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, exec, zen-browser

bind = $mainMod, return, fullscreen

# EWW BAR
# bind = $mainMod, B, exec, ~/scripts/toggle_eww.sh
# QUICKSHELL BAR
bind = $mainMod, B, exec, qs ipc call bar toggle
# Move focus with mainMod + arrow keys
bind = $mainMod, j, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u

# Move window within workspace
bind = $mainMod SHIFT, h,movewindow, l
bind = $mainMod SHIFT, j,movewindow, d
bind = $mainMod SHIFT, k,movewindow, u
bind = $mainMod SHIFT, l,movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = SHIFT $mainMod, left, resizeactive, -10 0
bind = SHIFT $mainMod, right, resizeactive, 10 0
bind = SHIFT $mainMod, up, resizeactive, 0 -10
bind = SHIFT $mainMod, down, resizeactive, 0 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Special Keys
bind = , xf86monbrightnessup, exec, brightnessctl set 5%+
bind = , xf86monbrightnessdown, exec, brightnessctl set 5%-
bind = , xf86audioraisevolume, exec, amixer set 'Master' 5%+
bind = , xf86audiolowervolume, exec, amixer set 'Master' 5%-
bind = , xf86audiomute, exec, amixer set 'Master' 0%


bind = SUPER ALT, L , exec, $lock

# lid lock handled by hypridle before_sleep_cmd
# bindl = ,switch:Lid Switch, exec, $lock


# source = ~/.config/hypr/env_var.conf
#
# windowrule = blur = on, class:^(eww-bar)$
# layerrule = blur = on, match:namespace = ^(gtk-layer-shell)$

# Blur the translucent Quickshell bar.
layerrule = blur = on, match:namespace = ^(quickshell-bar)$

windowrule = tile = on, match:title = ^(MATLAB R2023b - academic use)$
windowrule = float = on, match:title = ^(blueman-manager)$
windowrule = match:class ^(localsend)$, float on, size 1000 1000

exec = gsettings set org.gnome.desktop.interface gtk-theme "adwaita-dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

# env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
# env = XDG_SESSION_TYPE,wayland
# env = XDG_CURRENT_DESKTOP,Hyprland
# env = XDG_SESSION_DESKTOP,Hyprland 
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
